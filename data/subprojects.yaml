# 세부 연구과제(5개) — /research/ "세부 연구과제" 섹션에 표시.
# org: 담당기관, keywords: 키워드 칩, summary: 2~3줄 요약.
items:
  - title: 양방향 측위 기법을 활용한 Lunar GNSS 설계
    org: 세종대
    keywords:
      - ISL
      - 정밀궤도결정(POD)
      - 추진시스템
      - 우주정책
    summary: "위성 간 통신(ISL) Pairing Scheduler·항법 메시지 구조 설계, 이중차분(Iteration)·EKF(Centralized)·UKF(Distributed) 기반 POD 알고리즘 개발·비교, 초소형위성용 저추력 및 고체연료 하이브리드 추진(CHEMKIN 1D·CFD 다상유동 시뮬레이션), 기술국가주의 관점의 우주정책 기술로드매핑."
  - title: 초소형위성 시스템 및 테스트베드 개발
    org: 세종대
    keywords:
      - 위성시스템 설계
      - 우주환경시험
      - ADCS
      - HILS 테스트베드
    summary: "Lunar GNSS 초소형위성 시스템 설계(통신·탑재컴퓨터·구조·열제어·전력)와 시험모델 제작·우주환경시험, 위성 자세/궤적제어 알고리즘 및 자세결정·제어시스템(ADCS), 3자유도에서 5자유도로 확장되는 지상 HILS 테스트베드 구축."
  - title: 기준 위성 및 항법 위성 궤도 설계
    org: 서울대
    keywords:
      - 궤도동역학
      - Hohmann 천이
      - 안정궤도(PCO·ELFO)
      - 가시성궤도(NRHO)
      - PDOP
    summary: "달의 불규칙 중력장과 3체 운동을 고려한 궤도동역학, Hohmann 천이궤도, 항법위성용 안정궤도(PCO·ELFO)와 기준위성용 가시성 궤도(NRHO) 설계, 위성 가시성 최대화 배치와 PDOP 분석."
  - title: 우주 항법용 시각 동기 기술
    org: 연세대
    keywords:
      - CSAC
      - 시각오차 모델링
      - 칼만필터
      - Coasting
    summary: "CSAC(칩 스케일 원자시계)의 GPS 시각 대비 오차 예측·모델링, GPS 가시성이 낮을 때(4개 미만 수신) 정밀궤도정보와 칼만 필터를 결합한 시각 동기, 두 기법의 Coasting 성능 비교 분석."
  - title: Lunar GNSS 활용 측위 기술
    org: 홍익대
    keywords:
      - 융합측위
      - Cooperative Positioning
      - 착륙·탐사 측위
    summary: "달 저궤도에서의 Lunar/Earth GNSS 융합 측위(Snapshot Positioning, GNSS/IMU 칼만필터 융합), 통신 네트워크 기반 Cooperative Positioning, 달 표면 착륙·탐사용 정밀 위치추정(GNSS/IMU/Altimeter 융합, Beacon·Vision Marker 기반 Local Positioning Network)."
