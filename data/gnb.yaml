# 상단 GNB(글로벌 내비게이션) — 6개 메뉴.
# 메뉴에 마우스를 올리면 모든 메뉴의 하위 메뉴(sub)가 각 메뉴 아래 열로 한꺼번에 펼쳐집니다(메가 메뉴).
# sub 가 없는 메뉴(인사말·Lunar PNT)는 누르면 바로 해당 페이지로 이동합니다.
# 푸터 사이트맵도 이 파일을 그대로 따라갑니다.
- name: 인사말
  url: "/greeting/"
- name: 센터 안내
  url: "/about/"
  sub:
    - { name: 센터 소개, url: "/about/" }
    - { name: 참여기관, url: "/about/members/" }
    - { name: 참여 연구진, url: "/about/researchers/" }
    - { name: 오시는 길, url: "/contact/" }
- name: 연구 내용
  url: "/research/"
  sub:
    - { name: 전체 개요, url: "/research/" }
    - { name: 1세부, url: "/research/lunar-gnss-design/" }
    - { name: 2세부, url: "/research/cubesat-testbed/" }
    - { name: 3세부, url: "/research/orbit-design/" }
    - { name: 4세부, url: "/research/time-sync/" }
    - { name: 5세부, url: "/research/positioning/" }
- name: 연구 실적
  url: "/research/publications/"
  sub:
    - { name: 논문, url: "/research/publications/" }
    - { name: 학회 발표, url: "/research/presentations/" }
    - { name: 배출 인력, url: "/research/graduates/" }
    - { name: 세미나, url: "/research/seminars/" }
    - { name: 활동, url: "/research/activities/" }
- name: 게시판
  url: "/notice/"
  sub:
    - { name: 공지사항, url: "/notice/" }
    - { name: 최근 소식, url: "/news/" }
    - { name: 국제 동향, url: "/trends/" }
- name: Lunar PNT
  url: "/lunanet/"
