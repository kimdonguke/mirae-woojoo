# 메인 히어로 슬라이더 — 글(text) ↔ 사진(photo) 번갈아 배치.
# type: text | photo
#  - text : theme(a/b/c) 그라데이션 위에 title/desc
#  - photo: 전체 배경 사진. image 는 assets/img/ 기준 경로(예: hero/hero-1.jpg). caption(선택).
# ※ image 파일이 아직 없으면 해당 사진 슬라이드는 자동으로 건너뜁니다(글 슬라이드만 표시).
#   사진을 assets/img/hero/ 에 넣으면 6슬라이드(글·사진 번갈아)로 켜집니다.
- type: text
  title: 우주를 향한 미래, 미래우주
  desc: 우주를 향한 호기심을 함께 현실로 만들어 갑니다.
  theme: a
- type: photo
  image: hero/hero-1.jpg
  caption: ""
- type: text
  title: 함께 만들고, 함께 도전하다
  desc: 다양한 활동과 연구로 우주 기술에 도전합니다.
  theme: b
- type: photo
  image: hero/hero-2.jpg
  caption: ""
- type: text
  title: 함께 배우는 우주
  desc: 끊임없이 배우고 실험하며 도전합니다.
  theme: c
- type: photo
  image: hero/hero-3.jpg
  caption: ""
