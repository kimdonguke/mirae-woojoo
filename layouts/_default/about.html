{{ define "main" }}

    <div id="intro" class="page-section">
      <h2 class="page-h2">단체 소개</h2>
      <div class="prose">{{ .Content }}</div>
    </div>

    <div id="vision" class="page-section">

    <div id="history" class="page-section">

      <p class="page-empty">미래우주의 발자취를 정리하는 공간입니다. 아직 등록된 연혁이 없습니다.</p>
    </div>

    <div id="org" class="page-section">
      <h2 class="page-h2">조직·운영진</h2>
      <p class="page-empty">운영진과 팀 구성을 소개하는 공간입니다. 내용은 준비 중입니다.</p>
