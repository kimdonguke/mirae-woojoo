<section class="section section-alt" id="news">
  <div class="container">
    <header class="section-head reveal">
      <span class="section-num">03</span>
      <h2 class="section-title">소식</h2>
      <span class="section-kicker">News</span>
    </header>

    <div class="board reveal">
      <div class="board-tabs" role="tablist" aria-label="소식 분류">
        <button class="board-tab is-active" type="button" role="tab" aria-selected="true" data-panel="notice">공지사항</button>
        <button class="board-tab" type="button" role="tab" aria-selected="false" data-panel="news">뉴스</button>
        <button class="board-tab" type="button" role="tab" aria-selected="false" data-panel="events">행사일정</button>
      </div>

      {{ $board := site.Data.board }}
      {{ range $key := slice "notice" "news" "events" }}
      <ul class="board-list{{ if eq $key "notice" }} is-active{{ end }}" data-panel="{{ $key }}" role="tabpanel">
        {{ range (index $board $key) }}
        <li class="board-row">
          <a href="{{ .url | default "#" }}">
            <span class="board-title">{{ .title }}</span>
            <time class="board-date">{{ .date }}</time>
          </a>
        </li>
        {{ end }}
      </ul>
      {{ end }}

      <div class="board-more"><a href="#">전체 보기 +</a></div>
    </div>
  </div>
</section>
