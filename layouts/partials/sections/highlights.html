<section class="section" id="explore">
  <div class="container">
    <header class="section-head reveal">
      <span class="section-num">·</span>
      <h2 class="section-title">둘러보기</h2>
      <span class="section-kicker">Explore</span>
    </header>

    <div class="highlights reveal">
      {{ range site.Data.highlights }}
      <a class="hl-card hl-{{ .theme | default "a" }}" href="{{ .url }}">
        <div class="hl-text">
          <h3 class="hl-title">{{ .title }}</h3>
          <p class="hl-desc">{{ .desc }}</p>
          <span class="hl-link">자세히</span>
        </div>
        <span class="hl-media"{{ with .image }} style="background-image:url('{{ . }}')"{{ end }}></span>
      </a>
      {{ end }}
    </div>
  </div>
</section>
