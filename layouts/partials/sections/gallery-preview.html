{{ $photos := slice }}
{{ range site.Data.albums.items }}{{ range .photos }}{{ $photos = $photos | append . }}{{ end }}{{ end }}
{{ if $photos }}
<section class="section" id="gallery-preview">
  <div class="container">
    <header class="section-head reveal">
      <h2 class="section-title">갤러리</h2>
      <span class="section-kicker">Gallery</span>
    </header>
    <div class="gallery-grid reveal">
      {{ range first 6 $photos }}{{ partial "gallery-figure.html" . }}{{ end }}
    </div>
    <p class="section-foot"><a href="/gallery/">갤러리 더보기 →</a></p>
  </div>
</section>
{{ end }}
