<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e3a8a">
{{ if .Site.Params.noindex }}<meta name="robots" content="noindex, nofollow">{{ end }}

{{ $title := .Site.Title }}
{{ if not .IsHome }}{{ $title = printf "%s · %s" .Title .Site.Title }}{{ end }}
<title>{{ $title }}</title>
<meta name="description" content="{{ .Site.Params.description }}">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ .Site.Params.description }}">
<meta property="og:locale" content="ko_KR">

{{ with resources.Get "img/logo.png" }}
<link rel="icon" type="image/png" href="{{ (.Resize "48x png").RelPermalink }}">
<link rel="apple-touch-icon" href="{{ (.Resize "180x png").RelPermalink }}">
{{ end }}

<!-- Pretendard (한국어 웹폰트) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

{{ $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
