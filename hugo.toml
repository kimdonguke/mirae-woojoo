# ─────────────────────────────────────────────
# 미래우주 홈페이지 - Hugo 사이트 설정
# 배포 도메인(Cloudflare Pages). 커스텀 도메인 적용 시 이 값을 교체하세요.
# ─────────────────────────────────────────────
baseURL = "https://mirae-woojoo.pages.dev/"
locale = "ko-KR"
defaultContentLanguage = "ko"
title = "미래우주"
enableRobotsTXT = true
enableEmoji = true
# 사용하지 않는 분류(taxonomy) 페이지 생성 비활성화
disableKinds = ["taxonomy", "term"]
# 미래 날짜 글(예: 예정된 행사일정)도 빌드에 포함
buildFuture = true

[params]
  # 검색엔진 노출 차단 (공개 준비되면 false 로 바꾸고 static/_headers 도 함께 정리)
  noindex = true

  # 사이트 전역 정보 (이 값들만 바꿔도 대부분 수정됩니다)
  description = "다양한 활동과 연구로 우주 기술에 도전하는 미래우주 공식 홈페이지"
  email = "contact@miraewooju.org"
  github = ""          # 예: "https://github.com/your-org"
  nameEn = "Future Space"   # 푸터 영문 병기 (필요 없으면 비우세요)
  # familySites = [{ name = "GNSS LAB", url = "https://..." }]  # 푸터 패밀리사이트 (비우면 자동 숨김)

# 데이터는 data/ 폴더에서 관리합니다.
#   - data/gnb.yaml          : 상단 메뉴(5탭)
#   - data/hero.yaml         : 메인 슬라이더
#   - data/research.yaml     : 연구 분야 카드
#   - data/achievements.yaml : 연구 실적
#   - data/trends.yaml       : 국제 동향(LunaNet)
#   - data/albums.yaml       : 사진 앨범
#   - data/videos.yaml       : 동영상

[markup.goldmark.renderer]
  unsafe = true
